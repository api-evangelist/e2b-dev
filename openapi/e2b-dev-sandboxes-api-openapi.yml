                  message:
                    type: string
                    description: Error
                type: object
              examples:
                teamBanned:
                  summary: The team is banned at authentication
                  value:
                    code: 403
                    message: team is banned
                teamBlocked:
                  summary: The authenticated team is blocked. The message may append a reason
                  value:
                    code: 403
                    message: team is blocked
                egressProxyDisabled:
                  summary: Egress proxy configuration was supplied without feature access
                  value:
                    code: 403
                    message: Egress proxy (network.egressProxy) is not enabled for this team.
        '404':
          description: Not found
          content:

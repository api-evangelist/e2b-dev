      description: Get one secret's metadata, selected by identifier or name.
      tags:
      - Secrets
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/secretID'
      responses:
        '200':
          description: Successfully retrieved the secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
          headers:
            Cache-Control:
              description: Secret-management responses must not be cached.
              schema:
                type: string
                enum:
                - no-store
        '400':
          description: Bad request
          content:
            application/json:
              schema:

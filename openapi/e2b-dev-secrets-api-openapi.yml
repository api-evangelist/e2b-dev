components:
  parameters:
    paginationLimit:
      name: limit
      in: query
      description: Maximum number of items to return per page
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 100
        maximum: 100
    paginationNextToken:
      name: nextToken
      in: query
      description: Cursor to start the list from
      required: false
      schema:
        type: string
    secretID:
      name: secretID
      in: path
      required: true
      schema:
        type: string
        description: 'Identifier of the secret (sec_ prefixed), or its canonical lower-case name

          '
  schemas:
    NewSecret:
      type: object
      required:
      - name
      - value
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-zA-Z0-9_-]+$
          description: 'Name of the secret, unique within the project. Names are lower-cased before storage and returned in that canonical form; the sec_ prefix is reserved for secret identifiers.

            '
        value:
          type: string
          description: Runtime marker stored as the secret's first version. The runtime resolves it to a value at sandbox egress.
        metadata:
          $ref: '#/components/schemas/SecretMetadata'
    Secret:
      type: object
      description: Metadata of a secret. It never carries the secret value.
      required:
      - secretID
      - name
      - currentVersion
      - metadata
      - createdAt
      - updatedAt
      properties:
        secretID:
          type: string
          description: Identifier of the secret
        name:
          type: string
          description: Name of the secret, unique within the project
        currentVersion:
          type: integer
          format: int64
          description: Version served to readers that do not name one
        metadata:
          $ref: '#/components/schemas/SecretMetadata'
        createdAt:
          type: string
          format: date-time
          description: Time when the secret was created
        updatedAt:
          type: string
          format: date-time
          description: Time when the secret was last updated
    SecretMetadata:
      type: object
      description: 'Customer metadata of the secret. Always present, empty when unset. At most 32 entries; keys are limited to 128 bytes, values to 1024 bytes, and a secret''s metadata to 8192 bytes in total.

        '
      maxProperties: 32
      additionalProperties:
        type: string
        maxLength: 1024
    SecretUpdate:
      type: object
      required:
      - value
      properties:
        value:
          type: string
          description: Runtime marker stored as the secret's new version. The runtime resolves it to a value at sandbox egress.
        metadata:
          $ref: '#/components/schemas/SecretMetadata'
  headers:
    XNextToken:
      description: Cursor to fetch the next page of results, if more exist
      schema:
        type: string
  securitySchemes:
    AccessTokenAuth:
      type: http
      scheme: bearer
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    SandboxAccessTokenAuth:
      type: apiKey
      in: header
      name: X-Access-Token
      description: 'Sandbox access token (`envdAccessToken`) for authenticating requests to a running sandbox. Returned by: [POST /sandboxes](/api-reference/sandboxes/create-sandbox) (on create), [POST /sandboxes/{sandboxID}/connect](/api-reference/sandboxes/connect-to-sandbox) (on connect), [POST /sandboxes/{sandboxID}/resume](/api-reference/sandboxes/resume-sandbox) (on resume), and [GET /sandboxes/{sandboxID}](/api-reference/sandboxes/get-sandbox) (for running or paused sandboxes).'
    SandboxUserAuth:
      type: http
      scheme: basic
      description: Optional system user for the operation. Sets file ownership and resolves relative paths. Pass the desired username with no password. Defaults to the sandbox's default user when omitted.

      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSecret'
      responses:
        '201':
          description: Successfully created the secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
          headers:
            Cache-Control:
              description: Secret-management responses must not be cached.
              schema:

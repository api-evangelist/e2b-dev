openapi: 3.2.0
info:
  title: E2B Process API
  version: 0.1.0
  description: Complete E2B developer API. Platform endpoints are served on api.e2b.app. Sandbox endpoints (envd) are served on the shared sandbox host (sandbox.e2b.app); target a specific sandbox with the E2b-Sandbox-Id and E2b-Sandbox-Port headers.
servers:
- url: https://api.e2b.app
  description: E2B Platform API
security: []
tags:
- name: Process
paths:
  /process.Process/CloseStdin:
    servers:
    - url: https://sandbox.e2b.app
      description: Sandbox API (envd) - routes using sandbox ID and port headers
    post:
      tags:
      - Process
      summary: CloseStdin
      description: 'Close stdin to signal EOF to the process.

        Only works for non-PTY processes. For PTY, send Ctrl+D (0x04) instead.'
      operationId: process.Process.CloseStdin
      parameters:
      - name: E2b-Sandbox-Id
        in: header
        required: true
        description: Identifier of the target sandbox. Routes the request to that sandbox's envd over the shared sandbox host.
        schema:
          type: string
      - name: E2b-Sandbox-Port
        in: header
        required: true
        description: Port envd listens on inside the sandbox (default 49983).
        schema:
          type: integer
          default: 49983
        example: 49983
      - name: Connect-Protocol-Version
        in: header
        required: true
        schema:
          type: string
          enum:
          - '1'
        example: '1'
      - name: Connect-Timeout-Ms
        in: header
        schema:
          $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/process.CloseStdinRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/process.CloseStdinResponse'
        '400':
          description: 'The sandbox proxy rejects missing or invalid routing information. Connect RPC error: invalid_argument.'
          content:
            text/plain:
              schema:
                type: string
              examples:
                missingRoutingHeader:
                  summary: The sandbox proxy rejects missing or invalid routing information.
                  value: 'missing header

                    '
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectRPCError'
              examples:
                invalid_argument:
                  summary: Example invalid_argument response
                  value:
                    code: invalid_argument
                    message: 'Connect-Protocol-Version must be "1": got "invalid"'
        '401':
          description: 'Sandbox access-token or signature authentication failed. Connect RPC error: unauthenticated.'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/EnvdHTTPError'
                - $ref: '#/components/schemas/ConnectRPCError'
              examples:
                sandboxAuthentication:
                  summary: Missing or invalid sandbox credentials
                  value:
                    code: 401
                    message: unauthorized access, please provide a valid access token or method signing if supported
                unauthenticated:
                  summary: Example unauthenticated response
                  value:
                    code: unauthenticated
                    message: 'invalid username: ''nonexistent'''
        '404':
          description: 'Connect RPC error: not_found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectRPCError'
              examples:
                not_found:
                  summary: Example not_found response
                  value:
                    code: not_found
                    message: process with pid 2147483647 not found
        '500':
          description: 'The sandbox proxy encountered an unexpected routing error. Connect RPC error: unknown.'
          content:
            text/plain:
              schema:
                type: string
              examples:
                routingFailure:
                  summary: The sandbox proxy encountered an unexpected routing error.
                  value: 'Unexpected error when routing request: invalid sandbox port

                    '
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectRPCError'
              examples:
                unknown:
                  summary: Closing stdin is not supported for a PTY process
                  value:
                    code: unknown
                    message: 'error closing stdin: cannot close stdin for PTY process — send Ctrl+D (0x04) instead'
        '501':
          description: 'Connect RPC error: unimplemented.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectRPCError'
              examples:
                unimplemented:
                  summary: Example unimplemented response
                  value:
                    code: unimplemented
                    message: invalid input type *process.ProcessSelector
        '502':
          description: The sandbox proxy could not find the sandbox. Browser navigation may receive an HTML error page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxRoutingError'
              examples:
                sandboxNotFound:
                  value:
                    sandboxId: sandbox-id
                    message: The sandbox was not found
                    code: 502
            text/html:
              schema:
                type: string
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
      security:
      - SandboxAccessTokenAuth: []
      x-response-contract-source: https://github.com/e2b-dev/infra/blob/0c21aa2277b59a1d040761ed3fbbb29a78775470/packages/envd/internal/services/process/input.go#L86
  /process.Process/Connect:
    servers:
    - url: https://sandbox.e2b.app
      description: Sandbox API (envd) - routes using sandbox ID and port headers
    post:
      tags:
      - Process
      summary: Connect
      description: Server-streaming RPC. Use the Connect protocol with streaming support.
      operationId: process.Process.Connect
      requestBody:
        content:
          application/connect+json:
            schema:
              type: string
              format: binary
            x-connect-message-schema:
              $ref: '#/components/schemas/process.ConnectRequest'
        required: true
        description: Send Connect-framed bytes with Content-Type application/connect+json. Each uncompressed request frame begins with flags byte 0, then the JSON payload length as four big-endian bytes, then the UTF-8 JSON payload. The decoded payload follows `#/components/schemas/process.ConnectRequest` (x-connect-message-schema). Sending a bare JSON document does not encode a valid Connect request frame.
      responses:
        '200':
          description: 'Stream of ConnectResponse events Decoded terminal error example (the wire also includes the five-byte frame prefix): `{"error":{"code":"not_found","message":"process with pid 2147483647 not found"}}`. Connect-framed bytes, not an ordinary JSON document. Each frame has a one-byte flags field and a four-byte big-endian payload length. The decoded data payload follows x-connect-message-schema. The final frame has flags=2 and follows x-connect-end-stream-schema. RPC failures appear in its error object while the HTTP status remains 200. Authentication or routing failures before the stream can use the separate HTTP responses below.'
          content:
            application/connect+json:
              schema:
                type: string
                format: binary
              x-connect-message-schema:
                $ref: '#/components/schemas/process.ConnectResponse'
              x-connect-end-stream-schema:
                $ref: '#/components/schemas/ConnectEndStreamResponse'
              x-connect-decoded-examples:
                completed:
                  flags: 2
                  payload: {}
                failed:
                  flags: 2
                  payload:
                    error:
                      code: not_found
                      message: process with pid 2147483647 not found
        '400':
          description: The sandbox proxy rejects missing or invalid routing information.
          content:
            text/plain:
              schema:
                type: string
              examples:
                missingRoutingHeader:
                  summary: The sandbox proxy rejects missing or invalid routing information.
                  value: 'missing header

                    '
        '401':
          description: Sandbox access-token or signature authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvdHTTPError'
              examples:
                sandboxAuthentication:
                  summary: Missing or invalid sandbox credentials
                  value:
                    code: 401
                    message: unauthorized access, please provide a valid access token or method signing if supported
        '500':
          description: The sandbox proxy encountered an unexpected routing error.
          content:
            text/plain:
              schema:
                type: string
              examples:
                routingFailure:
                  summary: The sandbox proxy encountered an unexpected routing error.
                  value: 'Unexpected error when routing request: invalid sandbox port

                    '
        '502':
          description: The sandbox proxy could not find the sandbox. Browser navigation may receive an HTML error page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxRoutingError'
              examples:
                sandboxNotFound:
                  value:
                    sandboxId: sandbox-id
                    message: The sandbox was not found
                    code: 502
            text/html:
              schema:
                type: string
      security:
      - SandboxAccessTokenAuth: []
      parameters:
      - name: Connect-Protocol-Version
        in: header
        required: true
        schema:
          type: string
          enum:
          - '1'
        example: '1'
      - name: Connect-Timeout-Ms
        in: header
        schema:
          $ref: '#/components/schemas/connect-timeout-header'
      - name: E2b-Sandbox-Id
        in: header
        required: true
        description: Identifier of the target sandbox. Routes the request to that sandbox's envd over the shared sandbox host.
        schema:
          type: string
      - name: E2b-Sandbox-Port
        in: header
        required: true
        description: Port envd listens on inside the sandbox (default 49983).
        schema:
          type: integer
          default: 49983
        example: 49983
      x-response-contract-source: https://github.com/connectrpc/connect-go/blob/v1.18.1/protocol_connect.go#L1203-L1308
      x-codeSamples:
      - lang: python
        label: Python (Connect framing)
        source: "import json\nimport os\nimport struct\nimport urllib.request\n\n# Set E2B_SANDBOX_ID and E2B_ENVD_ACCESS_TOKEN from a secured sandbox's\n# create/connect response. This token is not your project API key.\n# E2B_PROCESS_PID must identify a running process in that sandbox.\nmessages = [{\"process\": {\"pid\": int(os.environ[\"E2B_PROCESS_PID\"])}}]\nbody = b\"\"\nfor message in messages:\n    payload = json.dumps(message).encode(\"utf-8\")\n    body += struct.pack(\">BI\", 0, len(payload)) + payload\n\nrequest = urllib.request.Request(\n    \"https://sandbox.e2b.app/process.Process/Connect\",\n    data=body,\n    headers={\n        \"Content-Type\": \"application/connect+json\",\n        \"Connect-Protocol-Version\": \"1\",\n        \"Connect-Timeout-Ms\": \"5000\",\n        \"E2b-Sandbox-Id\": os.environ[\"E2B_SANDBOX_ID\"],\n        \"E2b-Sandbox-Port\": \"49983\",\n        \"X-Access-Token\": os.environ[\"E2B_ENVD_ACCESS_TOKEN\"],\n    },\n    method=\"POST\",\n)\nwith urllib.request.urlopen(request, timeout=10) as response:\n    data = response.read()\n\n# HTTP 200 can still contain a terminal error. Decode each envelope.\noffset = 0\nwhile offset < len(data):\n    if len(data) - offset < 5:\n        raise ValueError(\"Truncated Connect envelope\")\n    flags, length = struct.unpack_from(\">BI\", data, offset)\n    offset += 5\n    if length > len(data) - offset:\n        raise ValueError(\"Truncated Connect message\")\n    message = json.loads(data[offset:offset + length])\n    offset += length\n    if flags & 2:\n        if message.get(\"error\"):\n            raise RuntimeError(message[\"error\"])\n        break\n    print(message)\n"

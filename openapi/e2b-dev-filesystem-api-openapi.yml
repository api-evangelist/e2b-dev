      - SandboxAccessTokenAuth: []
      x-response-contract-source: https://github.com/e2b-dev/infra/blob/0c21aa2277b59a1d040761ed3fbbb29a78775470/packages/envd/internal/services/filesystem/watch_sync.go#L201

openapi: 3.2.0
info:
  title: E2B Filesystem API
  version: 0.1.0
  description: Complete E2B developer API. Platform endpoints are served on api.e2b.app. Sandbox endpoints (envd) are served on the shared sandbox host (sandbox.e2b.app); target a specific sandbox with the E2b-Sandbox-Id and E2b-Sandbox-Port headers.
servers:
- url: https://api.e2b.app
  description: E2B Platform API
security: []
tags:
- name: Filesystem
paths:
  /files:
    servers:
    - url: https://sandbox.e2b.app
      description: Sandbox API (envd) - routes using sandbox ID and port headers
    get:
      summary: Download a file
      tags:
      - Filesystem
      security:
      - SandboxAccessTokenAuth: []
      parameters:
      - name: E2b-Sandbox-Id
        in: header
        required: true
        description: Identifier of the target sandbox. Routes the request to that sandbox's envd over the shared sandbox host.
        schema:
          type: string
      - name: E2b-Sandbox-Port
        in: header
        required: true
        description: Port envd listens on inside the sandbox (default 49983).
        schema:
          type: integer
          default: 49983
        example: 49983
      - $ref: '#/components/parameters/FilePath'
      - $ref: '#/components/parameters/User'
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/SignatureExpiration'
      - name: Range
        in: header
        description: Byte range to download.
        schema:
          type: string
        example: bytes=2-5
      - name: If-Modified-Since
        in: header
        description: Return 304 if the file has not changed since this HTTP date.
        schema:
          type: string
        example: Tue, 01 Jan 2030 00:00:00 GMT
      - name: Accept-Encoding
        in: header
        description: Supported transfer encodings include gzip and identity. Range and conditional requests require acceptable identity encoding.
        schema:
          type: string
        example: identity
      responses:
        '200':
          description: Entire file downloaded successfully. The Content-Type depends on the file. A gzip response uses the file extension's media type, or application/octet-stream as fallback.
          content:
            '*/*':
              schema:
                type: string
                format: binary
          headers:
            Accept-Ranges:
              schema:
                type: string
                example: bytes
            Last-Modified:
              schema:
                type: string
              description: File modification time as an HTTP date.
            Content-Length:
              schema:
                type: integer
              description: Response length when known.
        '206':
          description: Partial file content for a satisfiable Range request. Content-Type depends on the file, or is multipart/byteranges for multiple ranges.
          headers:
            Accept-Ranges:
              schema:
                type: string
                example: bytes
            Last-Modified:
              schema:
                type: string
              description: File modification time as an HTTP date.
            Content-Length:
              schema:
                type: integer
              description: Response length when known.
            Content-Range:
              description: Range returned for a single-range response.
              schema:
                type: string
                example: bytes 2-5/10
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '304':
          description: The file has not changed according to the conditional request. No response body.
          headers:
            Last-Modified:
              schema:
                type: string
              description: File modification time as an HTTP date.
        '400':
          description: Invalid path The sandbox proxy rejects missing or invalid routing information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: path '/home/user/docs' is a directory
                code: 400
            text/plain:
              schema:
                type: string
              examples:
                missingRoutingHeader:
                  summary: The sandbox proxy rejects missing or invalid routing information.
                  value: 'missing header

                    '
        '401':
          description: Invalid user Sandbox access-token or signature authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                upstream:
                  value:
                    message: 'error looking up user ''nonexistent'': user: unknown user nonexistent'
                    code: 401
                sandboxAuthentication:
                  summary: Missing or invalid sandbox credentials
                  value:
                    code: 401
                    message: missing signature query parameter
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: path '/home/user/missing.txt' does not exist
                code: 404
        '406':
          description: Requested encoding is not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unsupportedEncoding:
                  value:
                    code: 406
                    message: 'error parsing Accept-Encoding: no acceptable encoding found, supported: [gzip]'
                rangeRequiresIdentity:
                  value:
                    code: 406
                    message: identity encoding not acceptable for Range or conditional request
        '416':
          description: The requested byte range is invalid or does not overlap the file. This is a plain-text error from the file server.
          headers:
            Content-Range:
              description: File length for an unsatisfiable range.
              schema:
                type: string
                example: bytes */10
          content:
            text/plain:
              schema:
                type: string
              examples:
                rangeDoesNotOverlap:
                  value: 'invalid range: failed to overlap

                    '
        '500':
          description: Internal server error The sandbox proxy encountered an unexpected routing error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'error opening file ''/home/user/file.txt'': permission denied'
                code: 500
            text/plain:
              schema:
                type: string
              examples:
                routingFailure:
                  summary: The sandbox proxy encountered an unexpected routing error.
                  value: 'Unexpected error when routing request: invalid sandbox port

                    '
        '502':
          description: The sandbox proxy could not find the sandbox. Browser navigation may receive an HTML error page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxRoutingError'
              examples:
                sandboxNotFound:
                  value:
                    sandboxId: sandbox-id
                    message: The sandbox was not found
                    code: 502
            text/html:
              schema:
                type: string
      operationId: downloadFile
      x-response-contract-source: https://github.com/e2b-dev/infra/blob/0c21aa2277b59a1d040761ed3fbbb29a78775470/packages/envd/internal/api/download.go#L19-L184
    post:
      summary: Upload a file and ensure the parent directories exist.
      description: 'Any request header of the form `X-Metadata-: ` is persisted

        as a user-defined extended attribute on the uploaded file. The

        `X-Metadata-` prefix is stripped and the remaining header name is

        lowercased to form the metadata key; the resulting map is returned on

        `EntryInfo` lookups (e.g. `Stat`, `ListDir`).


        Each upload replaces the file''s metadata with the keys provided in

        that request: keys previously stored but absent from the new request

        are removed, and an upload that sends no `X-Metadata-*` header clears

        all existing metadata.


        Both keys and values must be printable US-ASCII (bytes `0x20`-`0x7E`)

        and are rejected with HTTP 400 otherwise. Each key is capped at 246

        bytes (the Linux VFS xattr-name limit minus the namespace prefix), and

        the combined size of all metadata on a file (keys plus values, with the

        namespace prefix counted per key) is capped at 4096 bytes to stay within

        the filesystem''s per-inode xattr budget. Multiple files in a single

        multipart upload receive the same metadata. If the same

        `X-Metadata-` header is sent more than once, only the first

        value is used.'
      tags:
      - Filesystem
      security:
      - SandboxAccessTokenAuth: []
      parameters:
      - name: E2b-Sandbox-Id
        in: header
        required: true
        description: Identifier of the target sandbox. Routes the request to that sandbox's envd over the shared sandbox host.
        schema:
          type: string
      - name: E2b-Sandbox-Port
        in: header
        required: true
        description: Port envd listens on inside the sandbox (default 49983).
        schema:
          type: integer
          default: 49983
        example: 49983
      - $ref: '#/components/parameters/FilePath'
      - $ref: '#/components/parameters/User'
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/SignatureExpiration'
      requestBody:
        $ref: '#/components/requestBodies/File'
      responses:
        '200':
          description: The file was uploaded successfully. The response contains serialized JSON. Current envd also serves these bytes as text/plain, so parse the text as JSON to read the upload entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntryInfo'
              example:
              - path: /home/user/hello.txt
                name: hello.txt
                type: file
            text/plain:
              schema:
                type: string
              x-decoded-schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntryInfo'
              examples:
                uploadedFile:
                  summary: JSON text describing the uploaded file
                  value: '[{"name":"example.txt","path":"/tmp/example.txt","type":"file"}]'
        '400':
          description: Invalid path The sandbox proxy rejects missing or invalid routing information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: path '/home/user/docs' is a directory
                code: 400
            text/plain:
              schema:
                type: string
              examples:
                missingRoutingHeader:
                  summary: The sandbox proxy rejects missing or invalid routing information.
                  value: 'missing header

                    '
        '401':
          description: Invalid user Sandbox access-token or signature authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                upstream:
                  value:
                    message: 'error looking up user ''nonexistent'': user: unknown user nonexistent'
                    code: 401
                sandboxAuthentication:
                  summary: Missing or invalid sandbox credentials
                  value:
                    code: 401
                    message: missing signature query parameter
        '500':
          description: Internal server error The sandbox proxy encountered an unexpected routing error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'error opening file ''/home/user/file.txt'': permission denied'
                code: 500
            text/plain:
              schema:
                type: string
              examples:
                routingFailure:
                  summary: The sandbox proxy encountered an unexpected routing error.
                  value: 'Unexpected error when routing request: invalid sandbox port

                    '
        '502':
          description: The sandbox proxy could not find the sandbox. Browser navigation may receive an HTML error page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxRoutingError'
              examples:
                sandboxNotFound:
                  value:
                    sandboxId: sandbox-id
                    message: The sandbox was not found
                    code: 502
            text/html:
              schema:
                type: string
        '507':
          description: Not enough disk space
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: not enough disk space available
                code: 507
      operationId: uploadFile
      x-response-contract-source: https://github.com/e2b-dev/infra/blob/0c21aa2277b59a1d040761ed3fbbb29a78775470/packages/envd/internal/api/upload.go#L345-L358
  /filesystem.Filesystem/CreateWatcher:
    servers:
    - url: https://sandbox.e2b.app
      description: Sandbox API (envd) - routes using sandbox ID and port headers
    post:
      tags:
      - Filesystem
      summary: CreateWatcher
      description: Non-streaming versions of WatchDir
      operationId: filesystem.Filesystem.CreateWatcher
      parameters:
      - name: E2b-Sandbox-Id
        in: header
        required: true
        description: Identifier of the target sandbox. Routes the request to that sandbox's envd over the shared sandbox host.
        schema:
          type: string
      - name: E2b-Sandbox-Port
        in: header
        required: true
        description: Port envd listens on inside the sandbox (default 49983).
        schema:
          type: integer
          default: 49983
        example: 49983
      - name: Connect-Protocol-Version
        in: header
        required: true
        schema:
          type: string
          enum:
          - '1'
        example: '1'
      - name: Connect-Timeout-Ms
        in: header
        schema:
          $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/filesystem.CreateWatcherRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/filesystem.CreateWatcherResponse'
        '400':
          description: 'The sandbox proxy rejects missing or invalid routing information. Connect RPC error: invalid_argument.'
          content:
            text/plain:
              schema:
                type: string
              examples:
                missingRoutingHeader:
                  summary: The sandbox proxy rejects missing or invalid routing information.
                  value: 'missing header

                    '
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectRPCError'
              examples:
                invalid_argument:
                  summary: Example invalid_argument response
                  value:
                    code: invalid_argument
                    message: 'Connect-Protocol-Version must be "1": got "invalid"'
        '401':
          description: 'Sandbox access-token or signature authentication failed. Connect RPC error: unauthenticated.'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/EnvdHTTPError'
                - $ref: '#/components/schemas/ConnectRPCError'
              examples:
                sandboxAuthentication:
                  summary: Missing or invalid sandbox credentials
                  value:
                    code: 401
                    message: unauthorized access, please provide a valid access token or method signing if supported
                unauthenticated:
                  summary: Example unauthenticated response
                  value:
                    code: unauthenticated
                    message: 'invalid username: ''nonexistent'''
        '404':
          description: 'Connect RPC error: not_found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectRPCError'
              examples:
                not_found:
                  summary: Example not_found response
                  value:
                    code: not_found
                    message: 'path /tmp/missing not found: stat /tmp/missing: no such file or directory'
        '500':
          description: 'The sandbox proxy encountered an unexpected routing error. Connect RPC error: internal.'
          content:
            text/plain:
              schema:
                type: string
              examples:
                routingFailure:
                  summary: The sandbox proxy encountered an unexpected routing error.
                  value: 'Unexpected error when routing request: invalid sandbox port

                    '
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectRPCError'
              examples:
                internal:
                  summary: Example internal response
                  value:
                    code: internal
                    message: 'error statting path /etc/hostname/child: stat /etc/hostname/child: not a directory'
        '502':
          description: The sandbox proxy could not find the sandbox. Browser navigation may receive an HTML error page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxRoutingError'
              examples:
                sandboxNotFound:
                  value:
                    sandboxId: sandbox-id
                    message: The sandbox was not found
                    code: 502
            text/html:
              schema:
                type: string
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
      security:
      - SandboxAccessTokenAuth: []
      - SandboxAccessTokenAuth: []
        SandboxUserAuth: []
      x-response-contract-source: https://github.com/e2b-dev/infra/blob/0c21aa2277b59a1d040761ed3fbbb29a78775470/packages/envd/internal/services/filesystem/watch_sync.go#L150

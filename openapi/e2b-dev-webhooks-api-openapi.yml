                  summary: The backend is not configured
                  value:
                    code: 503
                    message: Webhooks are not available
        '504':
          description: Backend timeout
          content:
            application/json:
              schema:
                required:
                - code
                - message
                properties:
                  code:
                    type: integer
                    format: int32
                    description: Error code
                    example: 504
                  error_code:
                    type: string
                    description: 'Machine-readable semantic error code. Not a closed set; initial values: sandbox_capacity_unavailable, sandbox_placement_timeout, sandbox_no_compatible_node, sandbox_create_failed (a node could not create the sandbox this time; retry), sandbox_create_refused (a node refused the sandbox for a reason no retry changes, such as a vcpu count out of bounds in the stored build; a server error, since no request field reaches that check), internal_server_error, secret_limit_reached, idempotency_request_mismatch, idempotency_in_progress, idempotency_outcome_unknown.'
                  message:
                    type: string
                    description: Error
                type: object
              examples:
                backendDeadlineExceeded:
                  summary: The backend deadline was exceeded
                  value:
                    code: 504
                    message: Error when querying webhook delivery stats
      operationId: getEventsWebhookStats
      summary: Get webhook statistics
components:
  schemas:
    WebhookDeliveriesListPayload:
      description: Paginated webhook delivery attempts grouped by event
      required:
      - data
      - nextCursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDeliveryGroup'
        nextCursor:
          type:
          - string
          - 'null'
          description: Cursor to pass to the next list request, or null when there is no next page.
      type: object
    WebhookConfiguration:
      description: Configuration for updating existing webhooks
      properties:
        enabled:
          type: boolean
        name:
          type: string
          description: Webhook user friendly name
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum:
            - sandbox.lifecycle.created
            - sandbox.lifecycle.killed
            - sandbox.lifecycle.paused
            - sandbox.lifecycle.resumed
            - sandbox.lifecycle.updated
            - sandbox.lifecycle.checkpointed
          example:
          - sandbox.lifecycle.created
        signatureSecret:
          type: string
          description: Secret used to sign the webhook payloads
          minLength: 32
          example: replace-with-your-random-signing-secret
      type: object
    WebhookDetail:
      description: Webhook detail response
      required:
      - id
      - teamId
      - name
      - createdAt
      - url
      - enabled
      - events
      properties:
        id:
          type: string
          description: Webhook unique identifier
        teamId:
          type: string
          description: Unique identifier for the team
        name:
          type: string
          description: Webhook user friendly name
        createdAt:
          type: string
          format: date-time
          description: Time when the template was created
        url:
          type: string
          format: uri
        enabled:
          type: boolean
        events:
          type: array
          items:
            type: string
      type: object
    WebhookDelivery:
      description: Webhook delivery attempt
      required:
      - id
      - teamId
      - webhookId
      - eventId
      - sandboxId
      - eventType
      - status
      - durationMs
      - requestBody
      - requestHeaders
      - requestUrl
      - errorClass
      - timestamp
      properties:
        id:
          type: string
          format: uuid
          description: Delivery attempt identifier
        teamId:
          type: string
          format: uuid
          description: Team identifier
        webhookId:
          type: string
          format: uuid
          description: Webhook configuration identifier
        eventId:
          type: string
          format: uuid
          description: Sandbox event identifier
        sandboxId:
          type: string
          description: Sandbox identifier
        eventType:
          type: string
          description: Sandbox event type
        status:
          type: string
          enum:
          - success
          - failed
          description: Delivery attempt status
        durationMs:
          type: integer
          format: int32
          description: Delivery request duration in milliseconds
        requestBody:
          type: string
          description: Serialized webhook request body
        requestHeaders:
          type: string
          description: JSON-encoded request headers with sensitive values redacted
        requestUrl:
          type: string
          format: uri
          description: URL attempted for this delivery
        responseBody:
          type:
          - string
          - 'null'
          description: Truncated response body, if a response was received
        responseHeaders:
          type:
          - string
          - 'null'
          description: JSON-encoded response headers, if a response was received
        responseHttpStatusCode:
          type:
          - integer
          - 'null'
          format: int32
          description: HTTP response status code, if a response was received
        errorClass:
          type:
          - string
          - 'null'
          enum:
          - http_error
          - dns_error
          - timeout
          - transport_error
          - request_error
          - signature_error
          - canceled
          description: Machine-readable non-HTTP or HTTP failure class
        errorMessage:
          type:
          - string
          - 'null'
          description: Error message for failures without a useful response body
        timestamp:
          type: string
          format: date-time
          description: Time when the delivery attempt started
      type: object
    WebhookCreation:
      description: Webhook creation response
      required:
      - id
      - name
      - createdAt
      - teamId
      - url
      - enabled
      - events
      properties:
        id:
          type: string
          description: Webhook unique identifier
        name:
          type: string
          description: Webhook user friendly name
        createdAt:
          type: string
          format: date-time
          description: Time when the template was created
        teamId:
          type: string
          description: Unique identifier for the team
        url:
          type: string
          format: uri
        enabled:
          type: boolean
        events:
          type: array
          items:
            type: string
      type: object
    WebhookDeliveryStatsBucket:
      description: Webhook delivery stats for a time bucket
      required:
      - timestamp
      - total
      - failed
      - durationMs
      properties:
        timestamp:
          type: string
          format: date-time
        total:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        durationMs:
          $ref: '#/components/schemas/WebhookDeliveryDurationStats'
      type: object
    WebhookDeliveryDurationStats:
      description: Webhook delivery duration statistics in milliseconds
      required:
      - minimum
      - average
      - maximum
      properties:
        minimum:
          type: number
          format: double
        average:
          type: number
          format: double
        maximum:
          type: number
          format: double
      type: object
    WebhookCreate:
      description: Configuration for registering new webhooks
      required:
      - name
      - url
      - events
      - signatureSecret
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum:
            - sandbox.lifecycle.created
            - sandbox.lifecycle.killed
            - sandbox.lifecycle.paused
            - sandbox.lifecycle.resumed
            - sandbox.lifecycle.updated
            - sandbox.lifecycle.checkpointed
          example:
          - sandbox.lifecycle.created
        enabled:
          type: boolean
          default: true
        signatureSecret:
          type: string
          description: Secret used to sign the webhook payloads
          minLength: 32
          example: replace-with-your-random-signing-secret
      type: object
    WebhookDeliveryGroup:
      description: Webhook delivery attempts grouped by sandbox event
      required:
      - eventId
      - eventType
      - sandboxId
      - attempts
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
        sandboxId:
          type: string
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'
      type: object
    WebhookDeliveryStats:
      description: Webhook delivery aggregate stats
      required:
      - buckets
      - total
      - failed
      - durationMs
      properties:
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDeliveryStatsBucket'
        total:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        durationMs:
          $ref: '#/components/schemas/WebhookDeliveryDurationStats'
      type: object
  parameters:
    webhookID:
      name: webhookID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    AccessTokenAuth:
      type: http
      scheme: bearer
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    SandboxAccessTokenAuth:
      type: apiKey
      in: header
      name: X-Access-Token
      description: 'Sandbox access token (`envdAccessToken`) for authenticating requests to a running sandbox. Returned by: [POST /sandboxes](/api-reference/sandboxes/create-sandbox) (on create), [POST /sandboxes/{sandboxID}/connect](/api-reference/sandboxes/connect-to-sandbox) (on connect), [POST /sandboxes/{sandboxID}/resume](/api-reference/sandboxes/resume-sandbox) (on resume), and [GET /sandboxes/{sandboxID}](/api-reference/sandboxes/get-sandbox) (for running or paused sandboxes).'
    SandboxUserAuth:
      type: http
      scheme: basic
      description: Optional system user for the operation. Sets file ownership and resolves relative paths. Pass the desired username with no password. Defaults to the sandbox's default user when omitted.

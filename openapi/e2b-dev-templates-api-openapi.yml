  /templates/{templateID}/files/{hash}:
    servers:
    - url: https://api.e2b.app
      description: E2B Platform API
    get:
      summary: Get build upload link
      description: Get an upload link for a tar file containing build layer files
      tags:
      - Templates
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/templateID'
      - in: path
        name: hash
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Hash of the files (lowercase hex SHA-256)
      responses:
        '201':
          description: The upload link where to upload the tar file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateBuildFileUpload'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                required:

          type: integer
          format: int64
          minimum: 0
        description: Unix timestamp for the end of the interval, in seconds, for which the metrics are returned.
      - in: query
        name: metric
        required: true
        schema:
          type: string
          enum:
          - concurrent_sandboxes
          - sandbox_start_rate
        description: Metric to retrieve the maximum value for

apis:
- aid: e2b-dev:e2b-code-interpreter-api
  name: E2B Code Interpreter SDK
  tags:
  - AI
  - Agents
  - Code Interpreter
  - Jupyter
  - Data Analysis
  humanURL: https://github.com/e2b-dev/code-interpreter
  properties:
  - url: https://github.com/e2b-dev/code-interpreter
    type: Documentation
  - url: https://e2b.dev/docs/code-interpreting/analyze-data-with-ai
    type: Documentation
  - url: https://github.com/e2b-dev/code-interpreter
    type: SDKs
  description: >-
    Higher-level SDK on top of the Sandbox API that exposes a Jupyter-style code interpreter for LLM-driven
    Python and JavaScript execution. Returns structured execution results including stdout, stderr, text,
    png, jpeg, svg, html, markdown, latex, json, javascript, pdf and chart outputs that map cleanly onto
    tool-use schemas for Anthropic, OpenAI, Mistral, Llama and other model providers.
- aid: e2b-dev:e2b-desktop-api
  name: E2B Desktop Sandbox SDK
  tags:
  - AI
  - Agents
  - Desktop
  - Computer Use
  - GUI
  humanURL: https://github.com/e2b-dev/desktop
  properties:
  - url: https://github.com/e2b-dev/desktop
    type: Documentation
  - url: https://github.com/e2b-dev/desktop
    type: SDKs
  description: >-
    Sandbox flavor that boots a Linux desktop environment with a noVNC stream and exposes mouse, keyboard,
    screenshot, and window-management primitives. Built for computer-use agents pairing vision-capable
    models like Claude and GPT with a real graphical desktop they can drive end to end.
